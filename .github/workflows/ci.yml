name: CI

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academy
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/academy
  AUTH_SECRET: ci-only-secret-not-used-at-runtime

jobs:
  runner:
    runs-on: ubuntu-latest
    steps:
      - name: Runtime versions
        run: |
          node --version
          npm --version

  checkout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checkout
        run: test -f package.json

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prisma generate

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npx prisma generate
      - run: npx tsc --noEmit

name: CI

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
    branches:
      - master

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academy
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/academy
  AUTH_SECRET: ci-only-secret-not-used-at-runtime

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
